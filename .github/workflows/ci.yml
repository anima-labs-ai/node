name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      # Same gate as release.yml, run at PR time so the mangle fails loud
      # before it can merge. See release.yml for the backstory.
      - name: Lint — forbid rebrand-mangled identifier
        run: |
          if grep -rn --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git "useanima[.]shs" .; then
            echo '::error::Found the rebrand mangle (anima.emails.* was find-replaced into a nonsense token). Fix it.'
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned, not `latest`: resolving a floating tag makes the job depend
          # on api.github.com, so an API 503 fast-fails it before it runs.
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build
